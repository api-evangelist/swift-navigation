- name: Swift Binary Protocol (SBP)
  description: >-
    The native binary protocol for Swift Navigation devices — Piksi and Duro GNSS receivers and the
    Starling positioning engine. 242 message types across 29 packages carry position, velocity,
    baseline and time solutions, raw observations and ephemerides, SSR corrections, integrity bounds,
    message signing, inertial and vehicle inputs, and device management. The machine-readable
    specification is published as YAML and every client library is generated from it, along with 225
    JSON Schema documents for the JSON representation.
  humanURL: https://swift-nav.github.io/libsbp/
  baseURL: tcp://{device-host}:55556
  tags:
  - Protocol
  - GNSS
  - Binary
  - JSON Schema
  properties:
  - type: Specification
    url: spec/swift-navigation-sbp-spec.yml
  - type: JSONSchema
    url: json-schema/swift-navigation-json-schema.yml
  - type: SourceCode
    url: https://github.com/swift-nav/libsbp
  - type: Documentation
    url: https://swift-nav.github.io/libsbp/
  - type: ChangeLog
    url: changelog/swift-navigation-changelog.yml
  - type: DataModel
    url: data-model/swift-navigation-data-model.yml
- name: Sora API
  description: >-
    gRPC service for collecting, storing and analysing device location time series. DeviceService (5
    RPCs) takes device state and events from the field; AppService (29 RPCs) queries and streams that
    data and manages projects, devices, layers, annotators, alertors and event generators. The
    complete contract is published as a public Buf Schema Registry module. The endpoint is no longer
    reachable — see lifecycle/ — but the contract remains public.
  humanURL: https://buf.build/swift-nav/sora-api
  baseURL: https://grpc.sora.swiftnav.com
  tags:
  - gRPC
  - Protobuf
  - Location
  - Time Series
  properties:
  - type: Protobuf
    url: grpc/swift-navigation-sora-api.yml
  - type: SourceCode
    url: https://github.com/swift-nav/sora-device-client
  - type: Documentation
    url: https://buf.build/swift-nav/sora-api
- name: Swift Navigation Web Data Endpoints
  description: >-
    First-party, keyless JSON endpoints on the Swift Navigation website that power the Skylark User
    Portal and the receiver compatibility checker — the 134-entry third-party receiver compatibility
    catalog, per-country Skylark variant availability, the Skylark support FAQ, and site navigation.
    They are named in the portal's own public runtime configuration but are not otherwise documented
    or versioned consistently.
  humanURL: https://www.swiftnav.com/compatibility-checker
  baseURL: https://www.swiftnav.com/wp-json
  tags:
  - JSON
  - Catalog
  - Undocumented
  properties:
  - type: Examples
    url: examples/swift-navigation-examples.yml
