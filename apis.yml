aid: swift-navigation
name: Swift Navigation
description: >-
  Swift Navigation builds precise positioning technology for mass-market applications — automotive
  ADAS and autonomy, mobile handsets, robotics, drones, micromobility, fleet and asset tracking, GIS
  and construction. Its flagship service, Skylark, is a cloud-based GNSS corrections service that
  streams RTCM 3.x corrections over NTRIP from regional casters in North America, Europe and Asia
  Pacific, correcting satellite clock, orbit and atmospheric errors to take positioning from several
  metres to a few centimetres. Skylark ships in three variants — Nx RTK (network RTK on virtual
  reference stations), Cx (PPP-RTK, continent-wide, ISO 26262:2018 certified by UL Solutions) and Dx
  (differential code corrections for handsets and IoT). Swift also publishes the Swift Binary
  Protocol (SBP), the open, machine-readable wire protocol for its Piksi and Duro GNSS receivers and
  its Starling positioning engine, along with generated client libraries in six languages, and it
  publishes the complete gRPC contract for its Sora location time-series service on the Buf Schema
  Registry.
