apis:
- name: Skylark Precise Positioning Service
  description: >-
    Real-time GNSS corrections delivered as continuously-open NTRIP streams. A client opens an HTTP
    GET against a regional caster mountpoint with HTTP Basic credentials issued per device, and the
    caster writes RTCM 3.x correction frames until the connection closes, while the client pushes its
    own approximate position back as NMEA GGA. Each caster serves a keyless NTRIP sourcetable at "/"
    that enumerates every stream, its RTCM message numbers and its constellation set.
  humanURL: https://www.swiftnav.com/products/skylark
  baseURL: http://na.all-freq.skylark.swiftnav.com:2101
  tags:
  - GNSS
  - Corrections
  - NTRIP
  - RTCM
  - Streaming
  properties:
