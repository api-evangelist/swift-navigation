mountpoints:
  skylark_dx:
    - {name: DX-MSM1, format: RTCM3 MSM1, content: DGNSS code corrections, frame: ITRF2020 current epoch}
  skylark_cx:
    - {name: MSM4, format: RTCM3 MSM4, content: Wide-lane RTK corrections, frame: ITRF2020 current epoch}
    - {name: MSM5, format: RTCM3 MSM5, content: Wide-lane RTK corrections, frame: ITRF2020 current epoch}
    - {name: OSR, format: Swift proprietary, content: Observation Space Representation, frame: ITRF2020 current epoch}
    - {name: SSR, format: Swift proprietary, content: State Space Representation, frame: ITRF2020 current epoch}
    - {name: SSR-integrity, format: Swift proprietary, content: SSR with integrity bounds, frame: ITRF2020 current epoch}
    - {name: SSR-integrity-AES-CMAC, format: Swift proprietary, content: SSR with integrity, AES-CMAC message signing, frame: ITRF2020 current epoch}
  skylark_nx_rtk:
    - {name: NXRTK-MSM5, format: RTCM3 MSM5, frame: ITRF2020 current epoch, availability: all regions}
    - {name: NXRTK-WGS84-G1674-MSM5, format: RTCM3 MSM5, frame: WGS84(G1674) epoch 2005.0, availability: all regions}
    - {name: NXRTK-NAD83-MSM5, format: RTCM3 MSM5, frame: NAD83(2011) epoch 2010.0, availability: contiguous United States only}
    - {name: NXRTK-DREF91-MSM5, format: RTCM3 MSM5, frame: ETRS89 DREF91(2016) epoch 1989.0, availability: Europe only}
    - {name: NXRTK-ETRF2000-MSM5, format: RTCM3 MSM5, frame: ETRS89 ETRF2000 epoch 2010.0, availability: Europe only}
    - {name: NXRTK-RTCM31, format: RTCM v3.1 (GPS only), frame: ITRF2020 current epoch, availability: all regions}
rtcm_messages_advertised:
  note: >-
    Read directly from the STR records of the probed sourcetables, not from prose. Every Skylark
    stream advertises the same base set plus its MSM tier.
  base: [1006, 1008, 1019, 1020, 1029, 1033, 1042, 1044, 1046]
  msm_by_mountpoint:
    DX-MSM1: [1071, 1091, 1121]
    MSM4: [1074, 1094, 1124]
    MSM5: [1075, 1095, 1125]
    NXRTK-MSM5: [1075, 1095, 1125]
  constellations: GPS+GAL+BDS
  carrier: 2 (full L1/L2)
  nmea_required: true
  authentication: 'B (Basic)'
  encryption: 'N'
  bitrate_advertised: 4000
