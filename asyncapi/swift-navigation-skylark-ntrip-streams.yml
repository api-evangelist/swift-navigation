generated: '2026-08-29'
method: probed
source: >-
  NTRIP sourcetables fetched from each Skylark caster on 2026-08-29, cross-read against
  https://support.swiftnav.com/support/solutions/articles/44002519397-ntrip-client-configuration-for-skylark-corrections
name: Skylark correction stream catalog
description: >-
  Skylark's event surface is not webhooks and not AsyncAPI. It is a set of continuously-open NTRIP
  streams: a client opens an HTTP GET against a caster mountpoint with Basic auth and the caster
  writes RTCM v3.x correction frames until the connection drops, while the client pushes its own
  position back up the same connection as NMEA GGA sentences. Swift Navigation publishes NO AsyncAPI
  document, so none is asserted here and no AsyncAPI or Webhooks pointer is emitted. What IS machine
  readable is the NTRIP sourcetable each caster serves anonymously at "/" — a real, keyless,
  content-typed (gnss/sourcetable) catalog of every stream, its RTCM message set and its
  constellations. Those were probed and saved verbatim under examples/.
protocol:
  name: NTRIP
  versions: ['1.0', '2.0']
  transport: HTTP/1.1 (v1) and HTTP/1.1 with Ntrip-Version header (v2)
  payload: RTCM 3.x, plus Swift proprietary SBP-in-RTCM for the OSR/SSR mountpoints
  client_uplink: NMEA GGA position sentences (required by the VRS-based Nx RTK mountpoints)
  discovery:
    method: GET /
    accept: any
    auth: none
    content_type: gnss/sourcetable
    note: >-
      The sourcetable is served WITHOUT credentials. That is the one part of Skylark an agent can
      read today with nothing issued to it, and it is genuinely useful — it enumerates every
      mountpoint, its RTCM message numbers, and its constellation set.
endpoint_pattern: '<region>.<frequency>.skylark.swiftnav.com:<port>'
regions:
  NA: North America
  EU: Europe
  AP: Asia Pacific
frequencies:
  L1L2: L1/L2
  L1L5: L1/L5
  all-freq: L1/L2/L5/L6
ports:
  - {port: 2101, transport: plain, note: standard NTRIP connection}
  - {port: 2102, transport: tls, note: TLS-encrypted}
  - {port: 2103, transport: mtls, note: mutual TLS; requires NTRIP v2}
