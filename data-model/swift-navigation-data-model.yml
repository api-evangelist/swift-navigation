      - {from: Annotation, to: DeviceState, type: belongs_to, via: Annotation.state_id}
      - {from: Annotator, to: Project, type: belongs_to, via: Annotator.project_id}
      - {from: AnnotatedDeviceState, to: Project, type: belongs_to, via: AnnotatedDeviceState.project_id}
      - {from: DeviceStateWithProjectIds, to: Project, type: has_many, via: project_ids}
    identifiers:
      style: opaque strings for entities, uint64 for time-series elements
      cursor: >-
        uint64 `cursor` on AnnotatedDeviceState. Stable, unique, opaque and ordered — see
