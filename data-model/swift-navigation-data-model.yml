name: Swift Navigation data model
note: >-
  Two unrelated domain models, derived from the two contracts in this repo. Nothing here is
  guessed — every entity and every relationship is read from a published .proto or SBP YAML
  definition.
models:
  - name: Sora
    source: grpc/swift-navigation-sora-app-v1beta-types.proto, grpc/swift-navigation-sora-v1beta-common.proto
    entities:
      - name: Project
        id: string
        description: A partition of device state data and its analysis configuration.
        fields: [id, name, description, color, demo_type, dashboard]
        note: >-
          Project.color is marked `[deprecated = true]` in the contract. Project.Dashboard is
          declared internal with an explicit no-compatibility promise.
      - name: Device
        id: string
        description: A process on a machine that authenticates to Sora and sends location data.
        fields: [id, name, color, project_id, demo_type]
      - name: DeviceState
        description: One time-series sample — device time, server receive time, position, orientation, free-form user data.
        fields: [device_id, time, time_received, pos, orientation, user_data]
      - name: Event
        description: A discrete occurrence at a position and time, typed by a string with a free-form payload.
        fields: [device_id, time, time_received, pos, type, payload, alertor_id]
      - name: Annotation
        fields: [project_id, device_id, state_id, data]
      - name: Annotator
        description: Configuration that produces annotations on device state; config schema depends on `type`.
        fields: [id, name, type, color, enabled, config, project_id]
      - name: Alertor
        description: Configuration for delivering an alert to an external system (e.g. Slack); config schema depends on `type`.
      - name: EventGenerator
        description: Configuration that derives Events from incoming state.
      - name: Layer
        description: A map layer in the Sora application.
      - name: Position
        kind: value-object
        fields: [lat, lon, alt]
        semantics: >-
          Degrees latitude/longitude in WGS 84. Altitude in metres above the EGM2008 ellipsoid;
          OMITTED alt means "local ground level", not zero — a distinction the contract states
          explicitly and an integrator would otherwise get wrong.
      - name: Orientation
        kind: value-object
        fields: [yaw, pitch, roll]
        semantics: >-
          Tait-Bryan intrinsic rotations applied yaw -> pitch -> roll, degrees clockwise, with
          X north/ahead, Y east/right, Z down.
    relationships:
      - {from: Device, to: Project, type: has_many, via: Device.project_id, note: repeated field — a device may belong to several projects}
      - {from: DeviceState, to: Device, type: belongs_to, via: DeviceState.device_id}
      - {from: Event, to: Device, type: belongs_to, via: Event.device_id}
      - {from: Event, to: Alertor, type: belongs_to, via: Event.alertor_id}
      - {from: Annotation, to: Project, type: belongs_to, via: Annotation.project_id}
