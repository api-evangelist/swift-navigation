findings:
  - id: staging-domain-leak
    surface: 'GET https://www.swiftnav.com/wp-json/footer/v1/data'
    status: 200
    detail: >-
      The production footer endpoint returns a logo URL pointing at an internal WordPress staging
      host — "http://swiftnavstaging.local/wp-content/uploads/2025/02/logo-all-white-1-1.png". The
      host is unresolvable outside Swift Navigation's network, so any consumer of this first-party
      endpoint (including Swift's own Skylark User Portal, which reads it as FOOTER_DATA_URL) gets a
      broken image. It is a content-migration artifact, not a security issue, but it is the kind of
      defect that only shows up when someone actually calls the endpoint.
    observed: '2026-08-29'
  - id: undocumented-namespaces
    surface: 'GET https://www.swiftnav.com/wp-json/'
    status: 200
    detail: >-
      The WordPress REST index advertises 718 routes across 49 namespaces. Four of the namespaces
      carrying first-party Skylark data use opaque, unversioned, randomly-generated slugs
      (e4lm6SFEc9, gy9i81x4mh, scXotoUe, exwatcvlc7) alongside three conventional versioned ones
      (footer/v1, country/v1, support/v1). The opaque slugs read as obscurity-by-naming rather than
      access control — the endpoints are fully public and keyless — and they make the surface
      impossible to depend on, because a slug rotation is indistinguishable from a deletion.
