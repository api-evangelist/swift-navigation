description: >-
  Real responses, captured verbatim from surfaces that answer without credentials. Swift Navigation
  publishes no request/response examples of its own — there is no OpenAPI, no Postman collection and
  no reference with sample payloads — so these probed captures are the only concrete examples in the
  profile. Every one is a live 200; none is constructed.
