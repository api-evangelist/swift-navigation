authentication:
  scheme: oauth2
  flow: urn:ietf:params:oauth:grant-type:device_code
  rfc: RFC 8628 (OAuth 2.0 Device Authorization Grant)
  detail: >-
    The contract documents its own auth in a comment on DeviceService.AuthServerInfo: a device calls
    the unauthenticated AuthServerInfo RPC, receives an Auth0AuthServerInfo {host, client_id,
    audience}, and runs an RFC 8628 device flow against it. The credentials used are the AppService
    credentials, and the browser leg of the flow is where a device gets bound to a project.
