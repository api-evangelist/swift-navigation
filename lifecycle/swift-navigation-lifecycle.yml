skylark:
  versioning: none
  change_communication: mountpoint and product renames announced as support articles
  events:
    - date: '2024-02-02'
      change: Skylark product variants renamed
      url: https://support.swiftnav.com/support/solutions/articles/44002508239-new-skylark-names-2024-02-02-
    - date: '2024-03-08'
      change: Skylark NTRIP mountpoint names changed
      url: https://support.swiftnav.com/support/solutions/articles/44002517400-new-skylark-mountpoint-names-2024-03-08-
      impact: >-
        A mountpoint rename is a breaking change for every deployed receiver, because the mountpoint
        string is baked into NTRIP client configuration in the field. Announced only as a knowledge
        base article, with no machine-readable notice and no deprecation window published.
  sla:
    published: false
    marketing_claim: >-
      The Skylark product page advertises "enterprise-grade SLAs" but no SLA document, uptime target
      or credit schedule is published at a public URL.
sora:
  status: retired
  evidence:
    - >-
      https://grpc.sora.swiftnav.com resolves (44.238.46.100) but serves an
      "O=Acme Co, CN=Kubernetes Ingress Controller Fake Certificate" placeholder certificate, so no
      validating client can connect.
    - >-
      https://support.swiftnav.com/support/solutions/articles/44002416509-introduction-to-sora - the
      article the Sora client README links to - returns a 302 redirect loop (curl stopped at 50 hops).
      It is absent from https://support.swiftnav.com/support/sitemap.xml.
    - >-
      sora-device-client last released 2023-04-17 (PyPI 1.1.0); the pinned sora-api BSR commit dates
      from 2023-03-29.
  note: >-
    The CONTRACT is still public and complete on buf.build/swift-nav/sora-api and is preserved in
    grpc/. Swift Navigation has never marked it deprecated, retired or sunset anywhere - the product
    simply stopped being reachable. That gap between a live published contract and a dead endpoint is
    the finding.
