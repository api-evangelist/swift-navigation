name: Swift Navigation API lifecycle
status_page:
  published: false
  probe:
    - {url: 'https://status.swiftnav.com/', result: 'DNS does not resolve'}
    - {url: 'https://swiftnav.statuspage.io/', result: 'redirects to atlassian.com/software/statuspage - no tenant'}
  detail: >-
    Swift Navigation publishes NO status page for Skylark. This is the sharpest operational gap in the
    profile: Skylark is a real-time correction service whose customers are autonomous vehicles,
    robots and survey equipment, and there is no public place to see whether a regional caster is up.
    The FAQ routes availability questions to a support ticket instead. No StatusPage pointer is
    emitted, because none exists.
deprecation_policy:
  published_document: false
  practice: documented-by-convention
  detail: >-
    Swift Navigation has no written deprecation policy page, but SBP encodes one in the contract
    itself and has followed it consistently for a decade. A superseded message is never deleted and
    its type number is never reused; it is renamed with a _DEP / _DEP_A ... _DEP_F suffix, kept in the
    spec, and kept in every generated binding. The result is that an old receiver and a current
    library still interoperate, and a reader of the spec can see the whole succession chain
    (MSG_OBS_DEP_A -> _DEP_B -> _DEP_C -> MSG_OBS). No Sunset or Deprecation HTTP headers apply -
    SBP is a binary wire protocol, not an HTTP API.
  http_headers:
    rfc8594_sunset: false
    deprecation_header: false
    note: na - no HTTP API surface to carry them.
