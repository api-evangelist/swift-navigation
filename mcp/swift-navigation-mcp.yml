gap:
  detail: >-
    The interesting absence is the credentialed one. An agent managing a fleet of receivers would
    want to add a device, read its NTRIP credentials, switch a Skylark variant, or pause a
    subscription — all of which the Skylark User Portal does through
    account-service.skylark.swiftnav.com and subscription-service.skylark.swiftnav.com. Neither
    service publishes a contract, so those operations cannot be described, let alone exposed as
    tools.
