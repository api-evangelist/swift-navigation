name: Swift Navigation client libraries and distributions
note: >-
  Swift Navigation's first-party client libraries are all generated from one source: the
  libsbp repository, which holds the machine-readable Swift Binary Protocol specification and
  emits bindings for C, Python, Rust, Java, JavaScript and Haskell from it. Every language
  binding therefore carries the SAME version number, released together. Verified against each
  registry's own metadata endpoint on 2026-08-29.
