name: Swift Navigation Skylark plans and pricing
plan_count: 0
detail: >-
  Swift Navigation publishes NO prices at any public URL. There is no /pricing page — the path
  redirects to the homepage — and no pricing page appears anywhere in the site's own sitemap index
  (152 support URLs, plus the page/post/news sitemaps, all checked 2026-08-29). What IS published is
  the SHAPE of the commercial model: three Skylark variants, monthly or annual billing terms,
  per-DEVICE subscriptions with no minimum or maximum device count, a 14-day free trial once per
  account on the first device with no payment method required, and Stripe-backed self-service
  checkout. The actual amounts only become visible after signing in to the Skylark User Portal and
  starting a device. Recording plan_count: 0 is therefore a statement about disclosure, not about the
  product: the plans exist and are self-service, but a buyer or an agent cannot compare them without
  creating an account.
