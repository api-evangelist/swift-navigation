name: Swift Navigation published rate limits
limit_count: 0
detail: >-
  Swift Navigation publishes no rate limits, no quotas and no throttling behaviour for any surface,
  and returns no rate-limit response headers on the surfaces that can be probed anonymously. This is
  less anomalous than it looks: the metered unit on Skylark is a DEVICE SUBSCRIPTION, not a request.
  One NTRIP credential holds one long-lived connection open and receives a continuous correction
  stream — there is no request count to limit. The FAQ says explicitly that there is no minimum or
  maximum number of receivers. What is genuinely undocumented is the failure behaviour an integrator
  actually needs: what happens on concurrent connections with the same device credential, and what a
  caster returns when a subscription lapses mid-stream.
limits: []
response_headers:
  published: []
  observed: []
  probe: >-
    Anonymous GET / against seven Skylark casters on 2026-08-29 returned HTTP 200 with content-type
    gnss/sourcetable and no X-RateLimit-*, RateLimit-* or Retry-After header. The wp-json data
    endpoints likewise returned no rate-limit headers.
exhaustion_status_code: undocumented
