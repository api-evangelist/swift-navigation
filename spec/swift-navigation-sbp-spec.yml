name: Swift Binary Protocol (SBP) — machine-readable protocol specification
description: >-
  SBP is Swift Navigation's native binary wire protocol for its GNSS receivers (Piksi, Duro) and
  for the Starling positioning engine. It is the company's real API contract: 29 YAML package
  definitions, 442 KB, that declare every message type, its field layout, units, bit-flags and
  enumerated values. Every first-party client library (C, Python, Rust, Java, JavaScript, Haskell),
  the JSON Schema set in json-schema/, and the Kaitai Struct descriptions are all GENERATED from
  these files — so this is the source of truth, not a rendering of it.
