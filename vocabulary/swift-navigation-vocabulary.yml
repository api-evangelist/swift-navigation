description: >-
  Swift Navigation publishes a 69-entry glossary of GNSS, positioning and automotive-safety
  terminology, one crawlable page per term, all listed in the site's own sitemap. It is the closest
  thing the company has to a published vocabulary, and it is genuinely load-bearing for anyone
  reading the rest of this profile: the mountpoint names, sourcetable fields and SBP message
  semantics all assume these definitions. Terms are enumerated from the sitemap; the definitions
  themselves live at the linked URLs and are not copied here.
