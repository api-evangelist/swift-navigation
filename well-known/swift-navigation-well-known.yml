source: Direct HTTP probes of every Swift Navigation host on 2026-08-29
note: >-
  Swift Navigation serves NO /.well-known document from any host it controls. Two failure modes
  are worth separating. www.swiftnav.com is a WordPress site with a catch-all that 301s every
  unknown path to the homepage and answers 200 with the marketing HTML — so /llms.txt,
  /openapi.json and every /.well-known/* path "succeed" with a 200 that is a soft-404, not a
  document. account.swiftnav.com (the Skylark User Portal SPA) does the same for /llms.txt and
  /openapi.json and returns a bare 403 for /.well-known/*. NO WellKnown or SecurityTxt pointer is
  emitted, because nothing here is a served document. The one real discovery document in Swift
  Navigation's stack is the OpenID Connect metadata for its Auth0 tenant (skylark-prod.us.auth0.com),
  saved below; it is hosted by Auth0 on Swift Navigation's behalf, not on a swiftnav.com host, and is
  recorded as such.
hosts:
